server:
  port: 8085
  # Never let Forwarded / X-Forwarded-* rewrite the request's remote address, host or scheme (Boot's "native" would
  # trust them from anyone): the client address is ratelimit.ClientAddress's job, with surge.security.trusted-proxies.
  forward-headers-strategy: none

spring:
  application:
    name: gateway
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # The rate limiter's only store. Lettuce would otherwise wait 60 s per command while Redis is down; login and
      # signup fail closed (503) once a command fails, the other buckets fail open.
      timeout: 1s
      connect-timeout: 1s
      # SEC-05: an ACL user (REDIS_USER, blank = Redis' default user) and its password. Blank = no AUTH (local
      # Redis); SURGE_ENV=prod refuses a blank password (common's StoreCredentials).
      username: ${REDIS_USER:}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri, NEVER issuer-uri: the auth service's issuer is the plain string "surge-auth", not a URL,
          # so OIDC discovery would fail. The issuer is checked by string comparison in SecurityConfig.
          jwk-set-uri: ${AUTH_JWKS_URI:http://auth-service:8082/api/auth/.well-known/jwks.json}
  cloud:
    config:
      # HTTP Basic for the config server (SEC-15). Unset = the development pair, which only a dev config server
      # accepts; SURGE_ENV=prod refuses it (common's StoreCredentials).
      username: ${CONFIG_USER:surge-dev}
      password: ${CONFIG_PASSWORD:dev-only-config-password}
    gateway:
      server:
        webflux:
          # CVE-2025-41235: X-Forwarded-* / Forwarded from any other peer are stripped, never passed on. Always the
          # same regex as surge.security.trusted-proxies (rate-limit client address); blank = no proxy trusted.
          trusted-proxies: ${surge.security.trusted-proxies:}
          httpclient:
            connect-timeout: 2000
            # Idle time waiting for the downstream's bytes. The SSE route overrides it with metadata response-timeout: -1.
            response-timeout: 30s

surge:
  # dev (default, local) or prod. Compose's prod overlay sets SURGE_ENV=prod: then no committed development key works.
  env: ${SURGE_ENV:dev}
  internal-identity:
    # The gateway signs every routed request's X-Surge-Identity (ES256, kid=gateway) with this private JWK.
    # Unset in dev = the committed DEV key (with a warning); prod refuses to start without a real one.
    issuer: gateway
    signing-key-location: ${SURGE_INTERNAL_SIGNING_KEY:}
  security:
    # The prod overlay sets SURGE_PUBLIC_DEPLOYMENT=true: then SURGE_ENV=dev refuses to start (common's SurgeEnv).
    public-deployment: ${SURGE_PUBLIC_DEPLOYMENT:false}
    issuer: surge-auth
    # Synthetic load-test identities (sub "lt-*" or claim lt=true) are refused unless a loadtest overlay sets this.
    allow-loadtest-subjects: ${SURGE_ALLOW_LOADTEST_SUBJECTS:false}
    # Regex over the socket peer's address (IPv6 in full form, e.g. 2001:db8:0:0:0:0:0:53). Only a matching peer's
    # X-Forwarded-For names the client (per-IP rate limits, ratelimit.ClientAddress). Blank = trust no proxy, key on
    # the peer. Compose sets nginx's address. SURGE_PUBLIC_DEPLOYMENT=true refuses blank or a pattern that trusts any
    # address (config/TrustedProxiesGuard).
    trusted-proxies: ${SURGE_TRUSTED_PROXIES:}
  routes:
    auth-uri: lb://auth-service
    catalog-uri: lb://catalog-service
    booking-uri: lb://booking-service
    notification-uri: lb://notification-service
    payment-uri: lb://payment-service
  gateway:
    breaker-timeout: 10s
    # How many calls each circuit breaker lets wait on its service at once (a Resilience4j semaphore bulkhead,
    # config/BulkheadConfig). One more is refused AT ONCE with 503 service-busy and Retry-After: 1 (fallback/
    # FallbackController), which clients retry: it never queues (a wait would block a Netty thread) and never opens
    # the breaker. Override per breaker in the environment, e.g. SURGE_GATEWAY_BULKHEAD_BOOKING=8000.
    bulkhead:
      # Holds and checkouts. booking-service's Tomcat takes 20,000 connections (its server.tomcat.max-connections),
      # and up to 15,000 of them may be seat streams (surge.stream.max-subscribers-total), which take the stream route
      # without a breaker: 20,000 - 15,000 = 5,000 are left for these calls.
      booking: 5000
      # Public catalog reads. catalog-service has Tomcat's default 8,192 connections and asks Elasticsearch (5 s
      # socket timeout) on every search: a few hundred calls in flight are already a deep queue for one search node.
      catalog: 300
      # Any other breaker (there is none yet).
      others: 100

eureka:
  client:
    service-url:
      # HTTP Basic in the URL (SEC-04): EUREKA_USER / EUREKA_PASSWORD (URL-safe), EUREKA_HOST = host:port. Unset =
      # the development pair, which only a dev discovery server accepts; SURGE_ENV=prod refuses it (StoreCredentials).
      defaultZone: http://${EUREKA_USER:surge-dev}:${EUREKA_PASSWORD:dev-only-eureka-password}@${EUREKA_HOST:localhost:8761}/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration: ERROR
