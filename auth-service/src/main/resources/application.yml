server:
  port: 8082

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  cloud:
    config:
      # HTTP Basic for the config server (SEC-15). Unset = the development pair, which only a dev config server
      # accepts; SURGE_ENV=prod refuses it (common's StoreCredentials).
      username: ${CONFIG_USER:surge-dev}
      password: ${CONFIG_PASSWORD:dev-only-config-password}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/auth}
    username: ${MYSQL_USER:surge}
    password: ${MYSQL_PASSWORD:surge}
  mail:
    # The email verification code (S5). Mailpit locally, like notification-service; no auth, no TLS.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

surge:
  # dev (default, local) or prod. Compose's prod overlay sets SURGE_ENV=prod, which turns on the startup guards.
  env: ${SURGE_ENV:dev}
  security:
    # The prod overlay sets SURGE_PUBLIC_DEPLOYMENT=true: SURGE_ENV=dev then refuses to start (StartupGuards, SurgeEnv).
    public-deployment: ${SURGE_PUBLIC_DEPLOYMENT:false}
  internal-identity:
    # Every request but health and the JWKS needs a verified X-Surge-Identity addressed to auth-service (rules in
    # config/AccessRulesConfig). SURGE_ENV=prod refuses to start without it.
    enforce: true
    # Public JWKS of every issuer. Blank = the committed DEV keys (dev/tests, with a warning); prod refuses blank.
    jwks-location: ${SURGE_INTERNAL_JWKS:}
    # gateway: routed requests. svc:notification: GET /internal/users/{id} (notification signs it from S3 on).
    allowed-issuers:
      - gateway
      - "svc:notification"
  auth:
    # Empty means "not configured": dev falls back to the local default, prod refuses to start (StartupGuards).
    admin-password: ${SURGE_ADMIN_PASSWORD:}
    admin-email: ${SURGE_ADMIN_EMAIL:admin@surge.local}
    jwt:
      # RSA signing key (PEM or JWK; docker/gen-jwt-key.sh). Unset: generated per start in dev, refused in prod.
      key-file: ${SURGE_JWT_KEY_FILE:}
      # Optional: an extra public key the JWKS serves next to the current one, for rotation (see jwt/JwtKeys).
      previous-key-file: ${SURGE_JWT_PREVIOUS_KEY_FILE:}
    test-tokens:
      # Mints JWTs for synthetic load-test users. Off unless a loadtest overlay enables it; never with SURGE_ENV=prod.
      enabled: ${SURGE_AUTH_TEST_TOKENS:false}

eureka:
  client:
    service-url:
      # HTTP Basic in the URL (SEC-04): EUREKA_USER / EUREKA_PASSWORD (URL-safe), EUREKA_HOST = host:port. Unset =
      # the development pair, which only a dev discovery server accepts; SURGE_ENV=prod refuses it (StoreCredentials).
      defaultZone: http://${EUREKA_USER:surge-dev}:${EUREKA_PASSWORD:dev-only-eureka-password}@${EUREKA_HOST:localhost:8761}/eureka
  instance:
    prefer-ip-address: true

management:
  health:
    mail:
      # Sign-in must keep working when the mail server is down (a code can be re-sent), so mail never fails health.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration: ERROR
