server:
  port: 8082

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/auth}
    username: ${MYSQL_USER:surge}
    password: ${MYSQL_PASSWORD:surge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

surge:
  auth:
    # Local-only default. Real deployments must set SURGE_ADMIN_PASSWORD.
    admin-password: ${SURGE_ADMIN_PASSWORD:surge-admin}
    test-tokens:
      # Mints JWTs for synthetic load-test users. Off unless explicitly enabled (compose enables it).
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration: ERROR
