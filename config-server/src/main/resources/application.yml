server:
  port: 8888

spring:
  application:
    name: config-server
  config:
    # S10: compose mounts CONFIG_PASSWORD as a file, /run/secrets/env/CONFIG_PASSWORD, never as an environment variable
    # (docker inspect and /proc/1/environ would show it). Each file in this directory becomes the property of its name.
    # The services read the same directory through common's SecretFiles.
    import: optional:configtree:${SURGE_SECRETS_DIR:/run/secrets/env}/
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:./config-repo}

surge:
  # dev (default, local) or prod; SURGE_PUBLIC_DEPLOYMENT=true (prod overlay) refuses dev.
  env: ${SURGE_ENV:dev}
  security:
    public-deployment: ${SURGE_PUBLIC_DEPLOYMENT:false}
  config-server:
    # HTTP Basic for everything but health (SEC-15, ConfigServerSecurity). Unset in dev = the development
    # credentials, with a warning; SURGE_ENV=prod refuses to start without both, or with the development password.
    username: ${CONFIG_USER:}
    password: ${CONFIG_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
