server:
  port: 8081
  tomcat:
    max-connections: 20000
    accept-count: 1000

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/booking}
    username: ${MYSQL_USER:surge}
    password: ${MYSQL_PASSWORD:surge}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      repositories:
        enabled: false

surge:
  hold:
    ttl: PT5M
  payment:
    fake:
      failure-rate: 0.0
  rate-limit:
    holds:
      capacity: 10
      refill-per-second: 2
  outbox:
    poll-interval: PT0.5S
    batch-size: 100
  pricing:
    tier-prices:
      PLATINUM: 4999
      GOLD: 2999
      SILVER: 1499

springdoc:
  api-docs:
    path: /api/bookings/v3/api-docs
  swagger-ui:
    path: /api/bookings/docs

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
