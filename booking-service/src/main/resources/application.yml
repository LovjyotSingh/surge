server:
  port: 8081
  tomcat:
    max-connections: 20000
    accept-count: 1000

spring:
  application:
    name: booking-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/booking}
    username: ${MYSQL_USER:surge}
    password: ${MYSQL_PASSWORD:surge}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      repositories:
        enabled: false

surge:
  hold:
    ttl: PT5M
  rate-limit:
    holds:
      capacity: 10
      refill-per-second: 2
  pricing:
    tier-prices:
      PLATINUM: 4999
      GOLD: 2999
      SILVER: 1499

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
