server:
  port: 8081
  tomcat:
    max-connections: 20000
    accept-count: 1000

spring:
  application:
    name: booking-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  cloud:
    config:
      # HTTP Basic for the config server (SEC-15). Unset = the development pair, which only a dev config server
      # accepts; SURGE_ENV=prod refuses it (common's StoreCredentials).
      username: ${CONFIG_USER:surge-dev}
      password: ${CONFIG_PASSWORD:dev-only-config-password}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/booking}
    username: ${MYSQL_USER:surge}
    password: ${MYSQL_PASSWORD:surge}
    hikari:
      maximum-pool-size: 30
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # UPDATEs flush in primary-key order, so a checkout locks its seats in ascending id order like the sale-move
        # guard's locking read (EventScheduledHandler): the two can wait for each other but never deadlock.
        order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    properties:
      # SEC-06: SASL/SCRAM with KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT (or SASL_SSL) and KAFKA_USER/KAFKA_PASSWORD
      # (surge.kafka below). The default PLAINTEXT is the local unauthenticated broker; the client then ignores the
      # SASL settings. SURGE_ENV=prod refuses PLAINTEXT and a missing user (common's StoreCredentials).
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${surge.kafka.username}" password="${surge.kafka.password}";'
    consumer:
      group-id: booking-catalog
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    # SEC-05: this service's own RabbitMQ user. The defaults are a local broker's; SURGE_ENV=prod refuses guest.
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # SEC-05: an ACL user (REDIS_USER, blank = Redis' default user) and its password. Blank = no AUTH (local
      # Redis); SURGE_ENV=prod refuses a blank password.
      username: ${REDIS_USER:}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

surge:
  kafka:
    # Read by spring.kafka.properties.sasl.jaas.config above (and checked in prod). No quotes or backslashes.
    username: ${KAFKA_USER:}
    password: ${KAFKA_PASSWORD:}
  # dev (default, local) or prod; SURGE_PUBLIC_DEPLOYMENT=true (prod overlay) refuses dev. Checked by common (SurgeEnv).
  env: ${SURGE_ENV:dev}
  security:
    public-deployment: ${SURGE_PUBLIC_DEPLOYMENT:false}
  internal-identity:
    # Every request but health needs a verified X-Surge-Identity addressed to booking-service (rules in
    # config/AccessRulesConfig). SURGE_ENV=prod refuses to start without it.
    enforce: true
    # Public JWKS of every issuer. Blank = the committed DEV keys (dev/tests, with a warning); prod refuses blank.
    jwks-location: ${SURGE_INTERNAL_JWKS:}
    # gateway: routed requests. svc:notification: GET /internal/orders/{id} (the ticket's order lookup).
    allowed-issuers:
      - gateway
      - "svc:notification"
    # booking signs its own calls to payment-service as svc:booking with this private JWK.
    # Blank = the committed DEV key (dev/tests, with a warning); prod refuses blank.
    issuer: "svc:booking"
    signing-key-location: ${SURGE_INTERNAL_SIGNING_KEY:}
  hold:
    ttl: PT5M
  stream:
    # SEC-09: open seat streams (SSE). Past either cap a new stream is 503 stream-capacity. The total leaves room in
    # Tomcat's 20,000 connections (server.tomcat.max-connections) for holds and checkout.
    max-subscribers-per-event: 5000
    max-subscribers-total: 15000
  payment:
    mode: fake
    base-url: http://payment-service
    fake:
      failure-rate: 0.0
  rate-limit:
    holds:
      capacity: 10
      refill-per-second: 2
  outbox:
    poll-interval: PT0.5S
    batch-size: 100
  pricing:
    tier-prices:
      PLATINUM: 4999
      GOLD: 2999
      SILVER: 1499

eureka:
  client:
    # Startup routing window: re-fetch the registry every 5 s, not the 30 s default.
    registry-fetch-interval-seconds: 5
    service-url:
      # HTTP Basic in the URL (SEC-04): EUREKA_USER / EUREKA_PASSWORD (URL-safe), EUREKA_HOST = host:port. Unset =
      # the development pair, which only a dev discovery server accepts; SURGE_ENV=prod refuses it (StoreCredentials).
      defaultZone: http://${EUREKA_USER:surge-dev}:${EUREKA_PASSWORD:dev-only-eureka-password}@${EUREKA_HOST:localhost:8761}/eureka
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /api/bookings/v3/api-docs
  swagger-ui:
    path: /api/bookings/docs

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    # Eureka/LoadBalancer starters make this cache hint fire at every start; no client-side LB cache tuning wanted.
    org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration: ERROR

# Circuit breaker + retry for the HTTP payment client (surge.payment.mode=http). Mirrored in config-repo/booking-service.yml.
# Slow calls (>= 2 s) count towards opening only when 100 % of calls are slow; failures open it at 50 %.
resilience4j:
  circuitbreaker:
    instances:
      payment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 100
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - dev.surge.booking.payment.PaymentTimeoutException
          - dev.surge.booking.payment.PaymentUnreachableException
  retry:
    instances:
      payment:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
