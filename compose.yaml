services:
  mysql:
    image: mysql:8.4
    profiles: [core]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-surge-root}
      MYSQL_DATABASE: booking
      MYSQL_USER: ${MYSQL_USER:-surge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-surge}
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-surge-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [core]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    profiles: [core]
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/booking
      MYSQL_USER: ${MYSQL_USER:-surge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-surge}
      REDIS_HOST: redis
    ports: ["8081:8081"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # JRE image has no curl/wget; use bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: ./web
    profiles: [core]
    ports: ["8080:80"]
    depends_on:
      booking-service: { condition: service_healthy }

  loadtest:
    build:
      context: .
      dockerfile: tools/loadtest/Dockerfile
    profiles: [loadtest]
    # entrypoint (not command) so `run loadtest --users N` appends args instead of replacing the base URL
    entrypoint: ["java", "-jar", "/app/loadtest.jar", "--base-url", "http://web", "--out", "/app/reports"]
    volumes:
      - ./reports:/app/reports
    depends_on:
      web: { condition: service_started }
