server:
  port: 8761

spring:
  application:
    name: discovery
  config:
    # S10: compose mounts EUREKA_PASSWORD as a file, /run/secrets/env/EUREKA_PASSWORD, never as an environment variable
    # (docker inspect and /proc/1/environ would show it). Each file in this directory becomes the property of its name.
    # The services read the same directory through common's SecretFiles.
    import: optional:configtree:${SURGE_SECRETS_DIR:/run/secrets/env}/

surge:
  # dev (default, local) or prod; SURGE_PUBLIC_DEPLOYMENT=true (prod overlay) refuses dev.
  env: ${SURGE_ENV:dev}
  security:
    public-deployment: ${SURGE_PUBLIC_DEPLOYMENT:false}
  discovery:
    # HTTP Basic for the registry and the dashboard (SEC-04, DiscoverySecurity). Unset in dev = the development
    # credentials, with a warning; SURGE_ENV=prod refuses to start without both, or with the development password.
    # Clients send the same pair in their defaultZone URL, so it must be URL-safe (letters, digits, - _ . ~).
    username: ${EUREKA_USER:}
    password: ${EUREKA_PASSWORD:}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # The Eureka server never uses client-side load balancing; the cache hint is noise.
    org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration: ERROR
