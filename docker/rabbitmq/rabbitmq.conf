# Mounted read-only as /etc/rabbitmq/conf.d/20-surge.conf, after the image's 10-defaults.conf (security audit
# SEC-05, SEC-06).
#
# Users, the surge vhost, permissions and the ticket topology come from the definitions file that
# docker/gen-secrets.sh renders (template: docker/rabbitmq/definitions.json.template). Importing definitions at boot
# means the default guest user is never created. Should one ever exist, it could only log in from localhost (the
# image's 10-defaults.conf allows it from anywhere).
#
# Permissions on vhost "surge" (configure / write / read regexes):
#   surge-admin   everything (management UI in compose.dev.yaml only)
#   booking       declares and publishes to the surge.tickets exchange; reads nothing
#   notification  declares and uses surge.tickets, surge.tickets.dlx, tickets and tickets.dlq: consumes the two
#                 queues, binds them, and publishes to surge.tickets when an admin replays the DLQ
# The topology itself is declared in the definitions too, so it exists before either service starts.
load_definitions = /run/secrets/rabbitmq-definitions.json
loopback_users.guest = true

# Logs to the console only: the root file system is read-only.
log.console = true
log.console.level = info
log.file = false
