# Surge edge with TLS (S10; security audit SEC-08 and §5). compose.prod.yaml and compose.tls-local.yaml start nginx
# with this file (nginx -c /etc/nginx/nginx-tls.conf) and publish 8080 as 80 and 8443 as 443:
#
#   8443 (443)  the site (app.conf: SPA and /api/ to the gateway), TLS 1.2 and 1.3 only, HTTP/2, HSTS on every
#               response ($surge_hsts, SURGE_HSTS_MAX_AGE).
#   8080 (80)   nothing of the site: Let's Encrypt's HTTP-01 challenge files (certbot --webroot), the container
#               health check, and a 301 to https://SURGE_SERVER_NAME for everything else (never to the client's Host).
#
# SURGE_SERVER_NAME and SURGE_HSTS_MAX_AGE come from the environment through /tmp/surge/tls-site.conf, which the
# image's entrypoint renders from /etc/nginx/surge-templates (see web/nginx-templates/surge/tls-site.conf.template).
# The certificate and key are read from /etc/nginx/tls/fullchain.pem and privkey.pem, a read-only bind mount of
# SURGE_TLS_DIR (docs/DEPLOY.md: a certbot deploy hook copies them there and reloads nginx; docker/gen-selfsigned-cert.sh
# writes a self-signed pair for a local try or for the very first start). Everything else is as in nginx.conf.

worker_processes 4;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/surge/http.conf;
  # $surge_https_host and $surge_hsts, rendered at start from SURGE_SERVER_NAME and SURGE_HSTS_MAX_AGE.
  include /tmp/surge/tls-site.conf;

  server {
    listen 8080 default_server backlog=16384;
    server_name _;

    limit_conn perip 50;
    include /etc/nginx/surge/security-headers.conf;

    location = /healthz {
      access_log off;
      allow 127.0.0.1;
      deny all;
      default_type text/plain;
      return 200 "ok\n";
    }

    # certbot certonly --webroot -w <SURGE_ACME_DIR> writes the token under .well-known/acme-challenge/; compose
    # mounts that directory here read-only. Only plain files, never a directory listing.
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type text/plain;
      try_files $uri =404;
    }

    # The configured name, not $host: a request with a forged Host header cannot make Surge redirect elsewhere.
    location / {
      return 301 https://$surge_https_host$request_uri;
    }
  }

  server {
    listen 8443 ssl default_server backlog=16384;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    include /etc/nginx/surge/tls.conf;

    include /etc/nginx/surge/app.conf;
  }
}
