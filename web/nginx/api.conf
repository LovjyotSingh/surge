# Everything under /api/ goes to the gateway, which authenticates, rate-limits and routes. Nothing else is proxied.
proxy_pass http://gateway;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx's id for this request (the client's own X-Request-Id is never passed on).
proxy_set_header X-Request-Id $request_id;
# SEC-11: the gateway trusts X-Forwarded-For only from this container (SURGE_TRUSTED_PROXIES) and uses its last
# hop as the client, so it is OVERWRITTEN with the real peer, never appended to.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Real-IP "";
proxy_set_header Proxy "";
# SEC-01: only the gateway says who the caller is (from the verified bearer token). A client's claim never passes.
proxy_set_header X-User-Id "";
proxy_set_header X-User-Email "";
proxy_set_header X-User-Roles "";
proxy_set_header X-Surge-Identity "";
include /etc/nginx/surge/api-response-headers.conf;
