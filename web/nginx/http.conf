# Everything at http level that both top-level configs share (nginx.conf: plain HTTP on 8080; nginx-tls.conf: TLS on
# 8443 and redirects on 8080). Included inside their http block.

include /etc/nginx/mime.types;
default_type application/octet-stream;
charset utf-8;
sendfile on;
tcp_nopush on;
server_tokens off;

client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

# SEC-19: one JSON line per request. The path is logged without its query string (search terms are user input).
log_format json escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","path":"$uri","status":$status,"bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,"upstream_status":"$upstream_status",'
  '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
access_log /dev/stdout json;

# SEC-09: slow-header and slow-body clients are cut off early.
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 15s;
keepalive_timeout 15s;
reset_timedout_connection on;
# SEC-24: 64k by default; /api/auth/ allows 16k and only the CSV import allows 6m (app.conf).
client_max_body_size 64k;

# To the gateway. Reading allows a little more than the gateway's own 30 s downstream response timeout, so the
# gateway answers first; the SSE location overrides it.
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 35s;

# Per-IP limits (SEC-09, SEC-10). A request whose key is empty is not counted: only compose.loadtest.yaml mounts a
# list of exempt addresses (the load-test container); the image ships an empty list.
geo $surge_limit_exempt {
  default 0;
  include /etc/nginx/surge/limit-exempt.geo;
}
map $surge_limit_exempt $surge_limit_key {
  0 $binary_remote_addr;
  1 "";
}
limit_conn_zone $surge_limit_key zone=perip:10m;
limit_conn_zone $surge_limit_key zone=sse:10m;
limit_req_zone $surge_limit_key zone=api:10m rate=20r/s;
limit_req_zone $surge_limit_key zone=signin:10m rate=1r/s;
limit_conn_status 429;
limit_req_status 429;
limit_conn_log_level warn;
limit_req_log_level warn;

# SEC-08 (S10): HSTS on every HTTPS response and never on plain HTTP (browsers ignore it there, and a plain-HTTP run
# must not pin a host to HTTPS). nginx sends no header whose value is empty. One year, subdomains included; add
# "preload" only after a few weeks of clean HTTPS (docs/DEPLOY.md).
map $scheme $surge_hsts {
  https "max-age=31536000; includeSubDomains";
  default "";
}

upstream gateway {
  server gateway:8085;
  # Idle connections kept open to the gateway, so a burst reuses them instead of opening new ones.
  keepalive 1024;
}
