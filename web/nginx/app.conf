# The Surge site: the single-page app and /api/ (to the gateway only). Included inside the server block that serves
# it: nginx.conf's plain-HTTP server on 8080, or nginx-tls.conf's TLS server on 8443.

root /usr/share/nginx/html;

limit_conn perip 50;
include /etc/nginx/surge/security-headers.conf;

# nginx's own refusals on /api/ answer in the API's problem+json shape (upstream errors pass through as they are).
error_page 413 @too_large;
error_page 429 @too_many;
error_page 502 503 504 @unavailable;

location = /healthz {
  access_log off;
  allow 127.0.0.1;
  deny all;
  default_type text/plain;
  return 200 "ok\n";
}

# Seat-map streams (SSE): unbuffered, long-lived, at most 4 at a time per client address.
location ~ ^/api/bookings/events/\d+/stream$ {
  limit_conn sse 4;
  limit_conn perip 50;
  limit_req zone=api burst=40 nodelay;
  include /etc/nginx/surge/api.conf;
  proxy_buffering off;
  proxy_cache off;
  # Longer than booking's 10-minute emitter timeout; EventSource reconnects by itself after that.
  proxy_read_timeout 15m;
}

location = /api/auth/login {
  limit_req zone=signin burst=10 nodelay;
  limit_req zone=api burst=40 nodelay;
  client_max_body_size 16k;
  include /etc/nginx/surge/api.conf;
}

location = /api/auth/signup {
  limit_req zone=signin burst=10 nodelay;
  limit_req zone=api burst=40 nodelay;
  client_max_body_size 16k;
  include /etc/nginx/surge/api.conf;
}

location /api/auth/ {
  limit_req zone=api burst=40 nodelay;
  client_max_body_size 16k;
  include /etc/nginx/surge/api.conf;
}

# The admin CSV import (catalog caps the file at 5 MB and the request at 6 MB) is the only large body. nginx would
# buffer it into /tmp (64 MB of tmpfs, shared with the whole server) before the gateway had checked who sent it,
# so anyone could fill /tmp with a handful of uploads. Instead it is streamed to the gateway as it arrives, and the
# gateway refuses a caller who is not an admin before reading any of it (gateway GatewaySecurityTest,
# anUploadIsRefusedBeforeItsBodyIsRead). limit_conn here replaces the server's 50 and shares its zone, so it counts
# every request the address has in progress: an upload starts only with at most one other request in flight.
location = /api/catalog/admin/events/import {
  limit_conn perip 2;
  limit_req zone=api burst=40 nodelay;
  client_max_body_size 6m;
  proxy_request_buffering off;
  include /etc/nginx/surge/api.conf;
}

location /api/ {
  limit_req zone=api burst=40 nodelay;
  include /etc/nginx/surge/api.conf;
}

# Hashed file names: cache for a year.
location /assets/ {
  include /etc/nginx/surge/html-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location = /index.html {
  include /etc/nginx/surge/html-headers.conf;
  add_header Cache-Control "no-cache" always;
}

# SPA fallback: /events/1, /tickets/42, /verify, /login … all render index.html.
location / {
  include /etc/nginx/surge/html-headers.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri /index.html;
}

location @too_large {
  include /etc/nginx/surge/api-response-headers.conf;
  default_type application/problem+json;
  return 413 '{"type":"https://surge.dev/problems/payload-too-large","title":"Payload Too Large","status":413,"detail":"The request body is too large.","requestId":"$request_id"}';
}

location @too_many {
  include /etc/nginx/surge/api-response-headers.conf;
  add_header Retry-After 1 always;
  default_type application/problem+json;
  return 429 '{"type":"https://surge.dev/problems/rate-limited","title":"Too Many Requests","status":429,"detail":"Too many requests or connections from your address. Slow down and try again.","requestId":"$request_id"}';
}

location @unavailable {
  include /etc/nginx/surge/api-response-headers.conf;
  add_header Retry-After 5 always;
  default_type application/problem+json;
  return 503 '{"type":"https://surge.dev/problems/service-unavailable","title":"Service Unavailable","status":503,"detail":"Surge is not reachable right now. Try again shortly.","requestId":"$request_id"}';
}
