# TLS settings for the 8443 server (nginx-tls.conf), after Mozilla's "intermediate" profile: TLS 1.2 and 1.3 only,
# forward-secret AEAD suites only (no DHE: no dhparam file to manage), the client's preferred order (every suite here
# is strong), no session tickets (their key would never rotate in a long-lived process). No OCSP stapling: Let's
# Encrypt ended its OCSP service, and stapling would need a resolver.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
