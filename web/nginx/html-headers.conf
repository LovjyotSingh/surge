# The single-page app. Vite emits one module script and one stylesheet from /assets and no inline script or style
# (web/Dockerfile fails the build otherwise), so nothing inline is allowed. img-src allows data: and blob: (the
# ticket PDF is offered through an object URL); connect-src 'self' covers the API and the SSE seat streams.
include /etc/nginx/surge/security-headers.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
