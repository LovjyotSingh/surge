# Sent on every response, errors included (SEC-08). Included at server level and again in every location that sets
# headers of its own, because nginx drops inherited add_header directives in such a location.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS on HTTPS responses only: $surge_hsts (http.conf) is empty over plain HTTP, and nginx sends no empty header.
add_header Strict-Transport-Security $surge_hsts always;
