# Surge edge, plain HTTP (security audit Task B: SEC-01, -08, -09, -11, -17, -19, -24). The image's default: local
# runs, the load test and the smoke test (compose.yaml publishes 127.0.0.1:8080 only). A public deployment runs
# nginx-tls.conf instead (compose.prod.yaml): TLS on 8443, and 8080 only redirects.
#
# The only upstream is the gateway. nginx is the one container that publishes a port; it runs unprivileged
# (uid 101), with a read-only root file system: everything it writes goes to /tmp (a tmpfs in compose).
# Shared snippets live in /etc/nginx/surge/ (web/nginx/ in the repo): http.conf (http level), app.conf (the site),
# and the header sets, because an add_header or proxy_set_header in a location replaces every inherited one: each
# location includes the full set it needs.

worker_processes 4;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/surge/http.conf;

  # Plain HTTP never sends HSTS: browsers ignore it there, and a plain run must not pin a host to HTTPS.
  map $scheme $surge_hsts {
    default "";
  }

  server {
    # A sale opens thousands of connections at once: a deep accept queue (compose raises somaxconn to match) instead
    # of the default 511, so the kernel does not drop them.
    listen 8080 default_server backlog=16384;
    server_name _;
    include /etc/nginx/surge/app.conf;
  }
}
