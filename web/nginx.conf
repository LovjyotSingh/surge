# Surge edge (security audit Task B: SEC-01, -08, -09, -11, -17, -19, -24).
#
# The only upstream is the gateway. nginx is the one container that publishes a port; it runs unprivileged
# (uid 101) on 8080, with a read-only root file system: everything it writes goes to /tmp (a tmpfs in compose).
# Shared snippets live in /etc/nginx/surge/ (web/nginx/ in the repo), because an add_header or proxy_set_header in
# a location replaces every inherited one: each location includes the full set it needs.

worker_processes 4;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # SEC-19: one JSON line per request. The path is logged without its query string (search terms are user input).
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  # SEC-09: slow-header and slow-body clients are cut off early.
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  keepalive_timeout 15s;
  reset_timedout_connection on;
  # SEC-24: 64k by default; /api/auth/ allows 16k and only the CSV import allows 6m (locations below).
  client_max_body_size 64k;

  # To the gateway. Reading allows a little more than the gateway's own 30 s downstream response timeout, so the
  # gateway answers first; the SSE location overrides it.
  proxy_connect_timeout 3s;
  proxy_send_timeout 15s;
  proxy_read_timeout 35s;

  # Per-IP limits (SEC-09, SEC-10). A request whose key is empty is not counted: only compose.loadtest.yaml mounts a
  # list of exempt addresses (the load-test container); the image ships an empty list.
  geo $surge_limit_exempt {
    default 0;
    include /etc/nginx/surge/limit-exempt.geo;
  }
  map $surge_limit_exempt $surge_limit_key {
    0 $binary_remote_addr;
    1 "";
  }
  limit_conn_zone $surge_limit_key zone=perip:10m;
  limit_conn_zone $surge_limit_key zone=sse:10m;
  limit_req_zone $surge_limit_key zone=api:10m rate=20r/s;
  limit_req_zone $surge_limit_key zone=signin:10m rate=1r/s;
  limit_conn_status 429;
  limit_req_status 429;
  limit_conn_log_level warn;
  limit_req_log_level warn;

  upstream gateway {
    server gateway:8085;
    # Idle connections kept open to the gateway, so a burst reuses them instead of opening new ones.
    keepalive 1024;
  }

  server {
    # A sale opens thousands of connections at once: a deep accept queue (compose raises somaxconn to match) instead
    # of the default 511, so the kernel does not drop them.
    listen 8080 default_server backlog=16384;
    # S10 (TLS): listen 8443 ssl; plus the certificate, ssl_protocols TLSv1.2 TLSv1.3 and HSTS
    # (see surge/security-headers.conf).
    server_name _;
    root /usr/share/nginx/html;

    limit_conn perip 50;
    include /etc/nginx/surge/security-headers.conf;

    # nginx's own refusals on /api/ answer in the API's problem+json shape (upstream errors pass through as they are).
    error_page 413 @too_large;
    error_page 429 @too_many;
    error_page 502 503 504 @unavailable;

    location = /healthz {
      access_log off;
      allow 127.0.0.1;
      deny all;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Seat-map streams (SSE): unbuffered, long-lived, at most 4 at a time per client address.
    location ~ ^/api/bookings/events/\d+/stream$ {
      limit_conn sse 4;
      limit_conn perip 50;
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/surge/api.conf;
      proxy_buffering off;
      proxy_cache off;
      # Longer than booking's 10-minute emitter timeout; EventSource reconnects by itself after that.
      proxy_read_timeout 15m;
    }

    location = /api/auth/login {
      limit_req zone=signin burst=10 nodelay;
      limit_req zone=api burst=40 nodelay;
      client_max_body_size 16k;
      include /etc/nginx/surge/api.conf;
    }

    location = /api/auth/signup {
      limit_req zone=signin burst=10 nodelay;
      limit_req zone=api burst=40 nodelay;
      client_max_body_size 16k;
      include /etc/nginx/surge/api.conf;
    }

    location /api/auth/ {
      limit_req zone=api burst=40 nodelay;
      client_max_body_size 16k;
      include /etc/nginx/surge/api.conf;
    }

    # The admin CSV import (catalog caps the file at 5 MB and the request at 6 MB) is the only large body.
    location = /api/catalog/admin/events/import {
      limit_req zone=api burst=40 nodelay;
      client_max_body_size 6m;
      include /etc/nginx/surge/api.conf;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/surge/api.conf;
    }

    # Hashed file names: cache for a year.
    location /assets/ {
      include /etc/nginx/surge/html-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location = /index.html {
      include /etc/nginx/surge/html-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: /events/1, /tickets/42, /verify, /login … all render index.html.
    location / {
      include /etc/nginx/surge/html-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }

    location @too_large {
      include /etc/nginx/surge/api-response-headers.conf;
      default_type application/problem+json;
      return 413 '{"type":"https://surge.dev/problems/payload-too-large","title":"Payload Too Large","status":413,"detail":"The request body is too large.","requestId":"$request_id"}';
    }

    location @too_many {
      include /etc/nginx/surge/api-response-headers.conf;
      add_header Retry-After 1 always;
      default_type application/problem+json;
      return 429 '{"type":"https://surge.dev/problems/rate-limited","title":"Too Many Requests","status":429,"detail":"Too many requests or connections from your address. Slow down and try again.","requestId":"$request_id"}';
    }

    location @unavailable {
      include /etc/nginx/surge/api-response-headers.conf;
      add_header Retry-After 5 always;
      default_type application/problem+json;
      return 503 '{"type":"https://surge.dev/problems/service-unavailable","title":"Service Unavailable","status":503,"detail":"Surge is not reachable right now. Try again shortly.","requestId":"$request_id"}';
    }
  }
}
