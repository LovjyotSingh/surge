version: 2

# Weekly updates. Minor and patch bumps are grouped into one PR per ecosystem to keep noise down;
# major bumps arrive as their own PRs so they get a proper look.
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /booking-service
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /tools/loadtest
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # Maven and npm are separate from compose: this tracks the image tags in compose.yaml
  # (today mysql and redis; Task 16 adds the platform images). The docker-compose ecosystem is
  # supported by Dependabot.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  # Task 16 adds a docker/ directory with more Dockerfiles. Add it here when it lands:
  # - package-ecosystem: docker
  #   directory: /docker
