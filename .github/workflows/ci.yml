name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests + integration tests. Testcontainers starts MySQL and Redis
      # in Docker, which GitHub's Ubuntu runners provide.
      - name: Build and test
        run: ./mvnw -B verify

  web:
    name: Web (Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  images:
    name: Docker images
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build all images (core + loadtest profiles)
        run: docker compose --profile core --profile loadtest build

  config-repo-secrets:
    name: config-repo holds no secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # config-repo/ is served to every service by the config server and is committed to git, so
      # anything in it is readable by all of them. Secrets must come from the environment or a
      # secret store, never from this directory. Fail on password, secret, token, credential or
      # private-key anywhere, and on any key: or key= line that carries a value. Case-insensitive.
      # A value that is only a ${...} placeholder is allowed.
      - name: Reject secrets in config-repo
        shell: bash
        run: |
          test -d config-repo || { echo "::error::config-repo missing"; exit 1; }
          hits=$(grep -rniE 'password|secret|token|credential|private[-_]?key|key[[:space:]]*[:=][[:space:]]*[^[:space:]#]' config-repo/             | grep -vE '[:=][[:space:]]*"?${[^}]*}"?[[:space:]]*$' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::config-repo/ must not contain passwords, secrets, tokens or key values"
            exit 1
          fi
