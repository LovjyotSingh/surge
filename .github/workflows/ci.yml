name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests + integration tests. Testcontainers starts MySQL and Redis
      # in Docker, which GitHub's Ubuntu runners provide.
      - name: Build and test
        run: ./mvnw -B verify

  web:
    name: Web (Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  # Every image Compose builds from this repository's Dockerfiles, built the same way and scanned by Trivy from the
  # local daemon, so the scan covers exactly what is deployed (SEC-17, SEC-28). Fails on a HIGH or CRITICAL
  # vulnerability that has a fix. The third-party images Compose runs as published (MySQL, Redis, Kafka, RabbitMQ,
  # Elasticsearch, Mailpit, S3Mock) are not scanned here: they are pinned by digest and Dependabot (docker-compose)
  # proposes their updates.
  images:
    name: Image ${{ matrix.image }} (build, Trivy)
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: config-server, dockerfile: docker/service.Dockerfile, context: ., module: config-server, port: '8888' }
          - { image: discovery, dockerfile: docker/service.Dockerfile, context: ., module: discovery, port: '8761' }
          - { image: auth-service, dockerfile: docker/service.Dockerfile, context: ., module: auth-service, port: '8082' }
          - { image: booking-service, dockerfile: docker/service.Dockerfile, context: ., module: booking-service, port: '8081' }
          - { image: catalog-service, dockerfile: docker/service.Dockerfile, context: ., module: catalog-service, port: '8083' }
          - { image: payment-service, dockerfile: docker/service.Dockerfile, context: ., module: payment-service, port: '8084' }
          - { image: notification-service, dockerfile: docker/service.Dockerfile, context: ., module: notification-service, port: '8086' }
          - { image: gateway, dockerfile: docker/service.Dockerfile, context: ., module: gateway, port: '8085' }
          - { image: web, dockerfile: web/Dockerfile, context: web }
          - { image: loadtest, dockerfile: tools/loadtest/Dockerfile, context: . }
          - { image: smoke, dockerfile: tools/smoke/Dockerfile, context: . }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          MODULE: ${{ matrix.module }}
          PORT: ${{ matrix.port }}
        run: |
          args=()
          if [ -n "$MODULE" ]; then
            args+=(--build-arg "MODULE=$MODULE" --build-arg "PORT=$PORT")
          fi
          DOCKER_BUILDKIT=1 docker build -f "$DOCKERFILE" "${args[@]}" -t "surge/$IMAGE:ci" "$CONTEXT"

      - name: Trivy image scan (HIGH, CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: surge/${{ matrix.image }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # The Compose files with every overlay are valid, and the platform publishes exactly one port: nginx's.
  compose:
    name: Compose config (only nginx publishes a port)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate and check published ports
        shell: bash
        run: |
          # Placeholder values and an empty file for every secret any compose file names: enough for `config`, never
          # for a real start.
          sed -E 's/^([A-Z_0-9]+)=$/\1=ci-placeholder-0123456789/' .env.example > .env
          mkdir -p docker/secrets
          for f in $(grep -ohE '\./docker/secrets/[A-Za-z0-9._-]+' compose*.yaml | sort -u); do
            : > "$f"
          done
          docker compose -f compose.yaml -f compose.dev.yaml -f compose.loadtest.yaml \
            --profile core --profile platform --profile loadtest --profile smoke config -q
          published=$(docker compose --profile core --profile platform config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null) | .key as $s
                     | .value.ports[] | "\($s) \(.host_ip // "0.0.0.0"):\(.published)->\(.target)"')
          echo "$published"
          if [ "$published" != "web 127.0.0.1:8080->8080" ]; then
            echo "::error::compose.yaml must publish only web on 127.0.0.1:8080"
            exit 1
          fi

      # S10: the production overlay publishes 80 and 443 only, starts no development service, and puts every Spring
      # service in public-deployment mode with mail over required STARTTLS. The local TLS overlay is valid.
      - name: Check the production overlay
        shell: bash
        env:
          MAIL_HOST: smtp.example.com
          MAIL_USERNAME: ci
          MAIL_FROM: Surge <no-reply@example.com>
          PUBLIC_BASE_URL: https://surge.example.com
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml -f compose.tls-local.yaml \
            --profile core --profile platform config -q
          prod=$(docker compose -f compose.yaml -f compose.prod.yaml --profile core --profile platform \
            config --format json)
          published=$(jq -r '.services | to_entries[] | select(.value.ports != null) | .key as $s
                             | .value.ports[] | "\($s) \(.host_ip // "0.0.0.0"):\(.published)->\(.target)"' <<< "$prod")
          echo "$published"
          if [ "$published" != $'web 0.0.0.0:80->8080\nweb 0.0.0.0:443->8443' ]; then
            echo "::error::compose.prod.yaml must publish only web on 80 and 443"
            exit 1
          fi
          dev=$(jq -r '.services | keys[] | select(test("^(mailpit|s3mock|loadtest|smoke)$"))' <<< "$prod")
          if [ -n "$dev" ]; then
            echo "::error::compose.prod.yaml must not start development services: $dev"
            exit 1
          fi
          not_public=$(jq -r '.services | to_entries[] | select(.value.environment.SURGE_ENV != null)
                              | select(.value.environment.SURGE_ENV != "prod"
                                       or .value.environment.SURGE_PUBLIC_DEPLOYMENT != "true") | .key' <<< "$prod")
          if [ -n "$not_public" ]; then
            echo "::error::every Spring service needs SURGE_ENV=prod and SURGE_PUBLIC_DEPLOYMENT=true: $not_public"
            exit 1
          fi
          plain_mail=$(jq -r '.services | to_entries[] | select(.value.environment.MAIL_HOST != null)
                              | select(.value.environment.MAIL_STARTTLS != "true"
                                       or .value.environment.MAIL_SMTP_AUTH != "true") | .key' <<< "$prod")
          if [ -n "$plain_mail" ]; then
            echo "::error::mail must use SMTP AUTH and required STARTTLS in production: $plain_mail"
            exit 1
          fi

  config-repo-secrets:
    name: config-repo holds no secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # config-repo/ is served to every service by the config server and is committed to git, so
      # anything in it is readable by all of them. Secrets must come from the environment or a
      # secret store, never from this directory. Fail on password, secret, token, credential or
      # private-key anywhere, and on any key: or key= line that carries a value. Case-insensitive.
      # A whole value that is only a plain ${NAME} placeholder (no ":default", nothing else on the
      # line) is allowed; "${A:hunter2}", "hunter2:${A}" and "${A}secret" are still flagged.
      - name: Reject secrets in config-repo
        shell: bash
        run: |
          test -d config-repo || { echo "::error::config-repo missing"; exit 1; }
          hits=$(grep -rniE 'password|secret|token|credential|private[-_]?key|key[[:space:]]*[:=][[:space:]]*[^[:space:]#]' config-repo/ \
            | grep -vE '^[^:]+:[0-9]+:[^:=]*[:=][[:space:]]*"?\$\{[A-Za-z_][A-Za-z0-9_.-]*\}"?[[:space:]]*$' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::config-repo/ must not contain passwords, secrets, tokens or key values"
            exit 1
          fi
