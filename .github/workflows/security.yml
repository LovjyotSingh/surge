name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'   # weekly: new advisories appear without any code change
  workflow_dispatch:

# Read-only everywhere. None of these jobs needs to write to the repo or to code scanning.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  OSV_SCANNER_VERSION: v2.7.1
  # SHA-256 of osv-scanner_linux_amd64 from the v2.7.1 release's osv-scanner_SHA256SUMS.
  OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8

jobs:
  dependency-scan:
    name: Dependency scan (OSV, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The scanner binary is pinned by version and checked against a SHA-256 recorded above.
      - name: Install osv-scanner
        run: |
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      # Scans every pom.xml (transitive dependencies are resolved) and web/package-lock.json, using
      # osv-scanner.toml (known HIGH advisories ignored until their expiry date, see
      # docs/security/accepted-risks.md; anything new still fails). osv-scanner has no severity
      # threshold of its own, so it writes JSON and the next step gates on CVSS >= 7.0.
      # Exit codes: 0 = clean, 1 = vulnerabilities found (the next step decides), 127 = scanner
      # error, 128 = no packages found. Anything but 0 or 1 fails the job here.
      - name: Scan Maven and npm manifests
        shell: bash
        run: |
          rc=0
          ./osv-scanner scan source --recursive --config osv-scanner.toml             --format json --output-file osv-results.json . || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::osv-scanner failed with exit code $rc (127 = error, 128 = no packages found)"
            exit 1
          fi
          test -s osv-results.json

      - name: Fail on high or critical findings
        shell: bash   # bash -eo pipefail: a jq failure stops the step
        run: |
          # Malformed or truncated JSON must fail the job, not read as "no findings".
          jq -e '.results | type == "array"' osv-results.json > /dev/null

          jq -r '
            [.results[] | .source.path as $src | .packages[]? | .package as $p
             | .groups[]? | select(((try (.max_severity | tonumber) catch 0) // 0) >= 7)
             | "($src): ($p.name)@($p.version) (.ids | join(", ")) (CVSS (.max_severity))"]
            | unique | .[]' osv-results.json > osv-high.txt

          # Advisories without a usable CVSS score cannot be gated; make them visible.
          jq -r '
            [.results[] | .source.path as $src | .packages[]? | .package as $p
             | .groups[]? | select((try (.max_severity | tonumber) catch null) == null)
             | "($src): ($p.name)@($p.version) (.ids | join(", "))"]
            | unique | .[]' osv-results.json > osv-unscored.txt

          while IFS= read -r line; do
            echo "::warning title=Unscored advisory::$line (no parseable CVSS score, review manually)"
          done < osv-unscored.txt

          if [ -s osv-high.txt ]; then
            cat osv-high.txt
            echo "::error::High or critical dependency vulnerabilities found (see log)"
            exit 1
          fi
          echo "No high or critical findings."

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: npm audit (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  trivy:
    name: Trivy (filesystem and config)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Filesystem mode today. Dependency vulnerabilities are left to OSV above, and Task 16 adds
      # image vulnerability scans, so the vuln scanner is not run here.
      - name: Trivy secrets (gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'

      # Advisory only for now: the Dockerfiles still trip misconfiguration checks (for example the
      # web image runs nginx as root).
      # TODO(Task 16): make this gating (exit-code 1) once web runs nginx-unprivileged.
      - name: Trivy misconfiguration (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'

      # TODO(Task 16): once the images are built in CI, scan each one here (scan-type: image,
      # image-ref: <name>:<tag>, severity HIGH,CRITICAL, exit-code 1, ignore-unfixed: true).
      # Targets: booking-service, web (nginx), tools/loadtest, plus every service image added under
      # docker/ (gateway, auth, catalog, notification, payment, config-server, discovery).
      # Build them in the `images` job of ci.yml (or here, with needs:) and scan from the local
      # daemon so the scan covers exactly what is deployed.
