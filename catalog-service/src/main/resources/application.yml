server:
  port: 8083

spring:
  application:
    name: catalog-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  cloud:
    config:
      # HTTP Basic for the config server (SEC-15). Unset = the development pair, which only a dev config server
      # accepts; SURGE_ENV=prod refuses it (common's StoreCredentials).
      username: ${CONFIG_USER:surge-dev}
      password: ${CONFIG_PASSWORD:dev-only-config-password}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # The CSV import is capped at 5 MB; the importer enforces the same limit itself.
      max-file-size: 5MB
      max-request-size: 6MB
      # SEC-24: parse the body only when the import controller asks for the file, i.e. after the identity chain and
      # the admin interceptor (AdminAccess) have let the caller through. A non-admin's upload is never parsed.
      resolve-lazily: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/catalog}
    username: ${MYSQL_USER:surge}
    password: ${MYSQL_PASSWORD:surge}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    # SEC-05: a user limited to the events index. Blank = no credentials (local Elasticsearch without security);
    # SURGE_ENV=prod refuses blank (common's StoreCredentials).
    username: ${ELASTICSEARCH_USER:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 2s
    socket-timeout: 5s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    properties:
      # SEC-06: SASL/SCRAM with KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT (or SASL_SSL) and KAFKA_USER/KAFKA_PASSWORD
      # (surge.kafka below). The default PLAINTEXT is the local unauthenticated broker; the client then ignores the
      # SASL settings. SURGE_ENV=prod refuses PLAINTEXT and a missing user (common's StoreCredentials).
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${surge.kafka.username}" password="${surge.kafka.password}";'
    consumer:
      # A new consumer group must start at the beginning so no sale is missed while catalog is down.
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000

surge:
  kafka:
    # Read by spring.kafka.properties.sasl.jaas.config above (and checked in prod). No quotes or backslashes.
    username: ${KAFKA_USER:}
    password: ${KAFKA_PASSWORD:}
  # dev (default, local) or prod; SURGE_PUBLIC_DEPLOYMENT=true (prod overlay) refuses dev. Checked by common (SurgeEnv).
  env: ${SURGE_ENV:dev}
  security:
    public-deployment: ${SURGE_PUBLIC_DEPLOYMENT:false}
  internal-identity:
    # Every request but health needs a verified X-Surge-Identity addressed to catalog-service (rules in
    # config/AccessRulesConfig). SURGE_ENV=prod refuses to start without it.
    enforce: true
    # Public JWKS of every issuer. Blank = the committed DEV keys (dev/tests, with a warning); prod refuses blank.
    jwks-location: ${SURGE_INTERNAL_JWKS:}
    # gateway: routed requests. svc:notification: GET /api/catalog/events/{id} (the ticket's event lookup).
    allowed-issuers:
      - gateway
      - "svc:notification"
  outbox:
    poll-interval: PT0.5S
    batch-size: 100
  pricing:
    # DUPLICATED from booking-service (surge.pricing.tier-prices): catalog only uses these for the
    # min/max price shown on an event. Keep both in step; the V2 seed hard-codes the same numbers.
    tier-prices:
      PLATINUM: 4999
      GOLD: 2999
      SILVER: 1499

eureka:
  client:
    service-url:
      # HTTP Basic in the URL (SEC-04): EUREKA_USER / EUREKA_PASSWORD (URL-safe), EUREKA_HOST = host:port. Unset =
      # the development pair, which only a dev discovery server accepts; SURGE_ENV=prod refuses it (StoreCredentials).
      defaultZone: http://${EUREKA_USER:surge-dev}:${EUREKA_PASSWORD:dev-only-eureka-password}@${EUREKA_HOST:localhost:8761}/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration: ERROR
