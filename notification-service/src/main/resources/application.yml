server:
  port: 8086

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/notification}
    username: ${MYSQL_USER:surge}
    password: ${MYSQL_PASSWORD:surge}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    connection-timeout: 5s
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        prefetch: 5
        # A rejected message is dead-lettered (tickets -> surge.tickets.dlx -> tickets.dlq), never requeued.
        default-requeue-rejected: false
        retry:
          enabled: true
          # Spring Boot 4 counts retries after the first try (it replaced max-attempts): 1 try + 2 retries = 3 attempts.
          max-retries: 2
          initial-interval: 1s
          multiplier: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # Only used to dead-letter poison audit records (orders.v1.audit.DLT).
      acks: all
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # Mailpit locally; no auth, no TLS. The send happens inside the ticket transaction, so it must not hang.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

surge:
  # dev (default, local) or prod; SURGE_PUBLIC_DEPLOYMENT=true (prod overlay) refuses dev. Checked by common (SurgeEnv).
  env: ${SURGE_ENV:dev}
  security:
    public-deployment: ${SURGE_PUBLIC_DEPLOYMENT:false}
  internal-identity:
    # Every request but health needs a verified X-Surge-Identity addressed to notification-service (rules in
    # config/AccessRulesConfig). SURGE_ENV=prod refuses to start without it.
    enforce: true
    # Public JWKS of every issuer. Blank = the committed DEV keys (dev/tests, with a warning); prod refuses blank.
    jwks-location: ${SURGE_INTERNAL_JWKS:}
    # Only the gateway: notification receives no service-to-service calls (it makes them, signed below).
    allowed-issuers:
      - gateway
    # notification signs its calls to booking, auth and catalog as svc:notification with this private JWK.
    # Blank = the committed DEV key (dev/tests, with a warning); prod refuses blank.
    issuer: "svc:notification"
    signing-key-location: ${SURGE_INTERNAL_SIGNING_KEY:}
  s3:
    # Empty endpoint = real AWS. Locally this is Adobe S3Mock (compose: http://s3mock:9090).
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-south-1}
    bucket: ${S3_BUCKET:surge-tickets}
    # LOCAL-ONLY placeholder credentials: S3Mock accepts anything. Real AWS needs S3_ACCESS_KEY / S3_SECRET_KEY.
    access-key: ${S3_ACCESS_KEY:surge-local}
    secret-key: ${S3_SECRET_KEY:surge-local}
  notification:
    # Daily orders-YYYY-MM-DD.jsonl files (IST dates). In compose this must be a mounted volume to survive restarts.
    audit-dir: ${AUDIT_DIR:./audit}
    # Where the download link in the email points (the web front door, nginx on 8080).
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  clients:
    # Resolved through Eureka by the load-balanced RestClient (service name = host).
    catalog-base-url: ${CATALOG_BASE_URL:http://catalog-service}
    auth-base-url: ${AUTH_BASE_URL:http://auth-service}
    booking-base-url: ${BOOKING_BASE_URL:http://booking-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.cloud.loadbalancer.config.LoadBalancerCacheAutoConfiguration: ERROR
