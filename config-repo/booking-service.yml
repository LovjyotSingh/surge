# Booking business settings. booking-service's own application.yml carries the same values as a
# fallback so it still starts without the config server; when the config server is up, THIS file wins.
surge:
  hold:
    ttl: PT5M
  rate-limit:
    holds:
      capacity: 10
      refill-per-second: 2
  outbox:
    poll-interval: PT0.5S
    batch-size: 100
  pricing:
    tier-prices:
      PLATINUM: 4999
      GOLD: 2999
      SILVER: 1499
  payment:
    # The deployed stack (compose) talks to the real payment-service; booking's own file defaults to fake.
    mode: http
    base-url: http://payment-service
resilience4j:
  circuitbreaker:
    instances:
      payment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 100
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - dev.surge.booking.payment.PaymentTimeoutException
  retry:
    instances:
      payment:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
